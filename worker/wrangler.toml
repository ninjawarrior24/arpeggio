name = "arpeggio-contact"
main = "src/index.js"
compatibility_date = "2026-09-10"

# Existing non-secret values and encrypted secrets are managed in Cloudflare.
# ALLOWED_ORIGINS = "https://www.arpeggio-resources.com,https://ninjawarrior24.github.io"

[[d1_databases]]
binding = "CONTACT_DB"
database_name = "arpeggio-contact-submissions"
database_id = "01d53abe-23a0-4d47-a9fd-7ac03366201c"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[triggers]
crons = ["0 4 * * *"]
